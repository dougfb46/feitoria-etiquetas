<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Etiquetas — Feitoria</title>
<script src="https://cdn.jsdelivr.net/npm/niimbot-web-bluetooth@1.3.5/src/niimbot.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{--ground:#F2F4F1;--surface:#fff;--ink:#131A16;--muted:#5C6660;--accent:#1F6F4A;
        --line:#D7DED8;--amber:#A8730C;--amber-bg:#F7EDD6;--red:#9A2B1E;--red-bg:#FBEAE6;--ok-bg:#E2F0E8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  #app{max-width:760px;margin:0 auto;padding:14px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .top b{font-size:15px}
  .top small{color:var(--muted);font-size:13px;display:block}
  .link{background:none;border:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:6px}
  .imp{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
  .imp .dotp{width:9px;height:9px;border-radius:50%;background:#C2C9C4;flex:0 0 auto}
  .imp.on .dotp{background:var(--accent)}
  .imp span{flex:1;color:var(--muted)}
  .imp.on span{color:var(--ink)}
  .imp button{border:1px solid var(--line);background:var(--ground);color:var(--ink);border-radius:7px;padding:6px 11px;font-size:13px}
  .imp select{width:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--ground);color:var(--ink);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:15px}
  .pinbox{max-width:320px;margin:6vh auto 0;text-align:center}
  .dots{display:flex;justify-content:center;gap:12px;margin:22px 0 26px;min-height:20px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pad button{height:68px;font-size:24px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;cursor:pointer}
  .pad button:active{background:var(--line)}
  .pad .wide{font-size:16px;font-weight:500;color:var(--muted)}
  .search{width:100%;padding:14px 16px;font-size:17px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;background:var(--surface);color:var(--ink)}
  .cat{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
  .card{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;min-height:62px}
  .card:active{border-color:var(--accent)}
  .card small{display:block;font-weight:400;color:var(--muted);margin-top:3px;font-size:13px}
  .big{width:100%;padding:18px;font-size:18px;font-weight:600;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;margin-top:16px}
  .big:disabled{opacity:.55}
  .ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:20px 0}
  .qty button{width:56px;height:56px;font-size:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
  .qty span{font-size:30px;font-weight:600;min-width:52px;text-align:center}
  .msg{border-radius:10px;padding:12px 14px;margin:14px 0;font-size:15px}
  .msg.e{background:var(--red-bg);color:var(--red)}
  .msg.s{background:var(--ok-bg);color:var(--accent)}
  .msg.w{background:var(--amber-bg);color:var(--amber)}
  #prev{display:block;margin:0 auto;width:250px;height:154px;border:1px solid var(--line);border-radius:6px;background:#fff}

  /* navegação entre etiquetar e validades */
  .nav{display:flex;gap:8px;margin:0 0 16px}
  .nav button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:15px;font-weight:600}
  .nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* lista de validades */
  .val{display:grid;gap:9px}
  .vitem{display:grid;grid-template-columns:5px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
  .vitem .b{width:5px;height:100%;min-height:38px;border-radius:3px;background:var(--line)}
  .vitem.venc .b{background:var(--red)}
  .vitem.hoje .b{background:var(--amber)}
  .vitem.ok .b{background:var(--accent)}
  .vitem .n{font-weight:600;line-height:1.2}
  .vitem .n em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
  .vitem .p{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
  .vitem.venc .p{color:var(--red)}
  .vitem.hoje .p{color:var(--amber)}

  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
  .switch{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);
          border-radius:10px;padding:14px 15px;margin:18px 0 12px;cursor:pointer;font-size:16px}
  .switch input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
  .acoes{position:sticky;bottom:0;background:linear-gradient(to top,var(--ground) 72%,transparent);
         padding:12px 0 6px;margin-top:6px}
  .acoes .big{margin-top:0}
  .aviso-acao{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .aviso-acao button{border:1px solid currentColor;background:transparent;color:inherit;
                     border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:600}
  .campo input,.campo select{width:100%;padding:14px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .destinos{display:grid;gap:9px;margin:14px 0}
  .ficha{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:8px}
  .ficha h2{font-size:19px;margin:0 0 4px}
  .ficha dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:14.5px}
  .ficha dt{color:var(--muted)}
  .ficha dd{margin:0}
  #leitor{width:100%;max-width:340px;border-radius:12px;display:none;margin:0 auto 12px}
  #folha{display:none}
  @media print{
    @page{size:50mm 30mm;margin:0}
    body{background:#fff}
    #app{display:none!important}
    #folha{display:block}
    #folha img{width:50mm;height:30mm;display:block;page-break-after:always}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="folha"></div>
<script>
(function(){
  var SUPA = 'https://kujelbcbrcmkitzyswbh.supabase.co';
  var FN = SUPA + '/functions/v1/etiqueta';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ';
  var TOKEN = new URLSearchParams(location.search).get('u') || '';
  var EXPIRA = 15 * 60 * 1000;

  var W = 576, H = 354;
  var EMPRESA_CURTA = 'FEITORIA PUB CAFE MOGI';
  var EMPRESA_LINHA = 'FEITORIA PUB CAFE MOGI LTDA - ME  ·  CNPJ 60.006.003/0001-64';
  var MODELO_FALLBACK = { name_prefixes:['B1'], task:'v4', density:3, label_type:1, speed:1 };
  var TAM_FALLBACK = { w_px:W, h_px:H, offset_y_px:0 };

  var S = { pin:'', sessao:null, produto:null, metodo:null, qtd:1, tela:'pin',
            erro:'', aviso:'', busca:'', ultimo:0, bt:null, btMsg:'', btInfo:'', dens:3,
            itens:[], item:null, carregando:false, medQtd:'', medUn:'',
            porcaoOn:false, ultima:null,
            av:{ nome:'', metodo:'refrigerado', dias:3, qtd:1 } };

  try { var dsalvo = parseInt(localStorage.getItem('feitoria_densidade'), 10);
        if (dsalvo >= 1 && dsalvo <= 5) S.dens = dsalvo; } catch(e){}
  var app = document.getElementById('app');

  var METODOS = {
    ambiente:     { nome:'Ambiente',     dica:'seco, temperatura ambiente' },
    refrigerado:  { nome:'Refrigerado',  dica:'até 4 graus' },
    congelado:    { nome:'Congelado',    dica:'-18 graus' },
    descongelado: { nome:'Descongelado', dica:'após descongelar' }
  };

  window.onerror = function(m){ document.body.insertAdjacentHTML('afterbegin',
    '<div class="msg e" style="margin:10px">Erro na tela: ' + m + '</div>'); };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

  function prazoTexto(h){
    if (h % 24 === 0) { var d = h / 24; return d + (d === 1 ? ' dia' : ' dias'); }
    return h + 'h';
  }
  function dh(iso){
    return new Date(iso).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo',
      day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }).replace(',', '');
  }

  function chamar(payload){
    return fetch(FN, { method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':ANON, 'Authorization':'Bearer ' + ANON },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json().then(function(j){
      if (!r.ok) throw new Error(j.error || 'Erro inesperado.'); return j; }); });
  }

  function salvar(){ try { sessionStorage.setItem('feitoria',
    JSON.stringify({ pin:S.pin, sessao:S.sessao, t:Date.now() })); } catch(e){} }
  function toque(){ S.ultimo = Date.now(); salvar(); }
  function sair(){
    try { sessionStorage.removeItem('feitoria'); } catch(e){}
    S.pin=''; S.sessao=null; S.produto=null; S.metodo=null; S.tela='pin';
    S.erro=''; S.aviso=''; S.busca=''; render();
  }
  setInterval(function(){ if (S.sessao && Date.now() - S.ultimo > EXPIRA) sair(); }, 20000);

  function quebrar(ctx, texto, largura, maxLinhas){
    var palavras = String(texto).split(' '), linhas = [], atual = '';
    for (var i = 0; i < palavras.length; i++) {
      var teste = atual ? atual + ' ' + palavras[i] : palavras[i];
      if (ctx.measureText(teste).width > largura && atual) { linhas.push(atual); atual = palavras[i]; }
      else atual = teste;
    }
    if (atual) linhas.push(atual);
    if (linhas.length > maxLinhas) {
      linhas = linhas.slice(0, maxLinhas);
      linhas[maxLinhas - 1] = linhas[maxLinhas - 1].replace(/.{2}$/, '..');
    }
    return linhas;
  }

  function desenhar(dados, canvas){
    var c = canvas || document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var m = METODOS[dados.conservacao] || { nome:dados.conservacao };
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#000'; x.textBaseline = 'top';
    x.font = 'bold 20px Arial, sans-serif';
    x.fillText(EMPRESA_CURTA, 14, 10);
    x.textAlign = 'right'; x.fillText(String(m.nome).toUpperCase(), W - 14, 10); x.textAlign = 'left';
    x.fillRect(14, 38, W - 28, 3);

    // QR do código individual, canto direito — é por ele que se dá baixa
    var codigo = dados.codigo || dados.lote || '';
    var larguraTexto = W - 28;
    if (codigo && typeof qrcode !== 'undefined') {
      try {
        var qr = qrcode(0, 'M');
        qr.addData(codigo);
        qr.make();
        var mods = qr.getModuleCount();
        var lado = 124, px = lado / mods, x0 = W - lado - 14, y0 = 50;
        x.fillStyle = '#fff'; x.fillRect(x0 - 4, y0 - 4, lado + 8, lado + 8);
        x.fillStyle = '#000';
        for (var lin = 0; lin < mods; lin++) {
          for (var col = 0; col < mods; col++) {
            if (qr.isDark(lin, col)) {
              x.fillRect(x0 + col * px, y0 + lin * px, Math.ceil(px), Math.ceil(px));
            }
          }
        }
        larguraTexto = W - 28 - lado - 16;
      } catch (e) {}
    }

    x.font = 'bold 40px Arial, sans-serif';
    var linhas = quebrar(x, dados.produto, larguraTexto, 2);
    var y = 48;
    for (var i = 0; i < linhas.length; i++) { x.fillText(linhas[i], 14, y); y += 42; }

    // porcionamento: "80 un", "600 g" — só aparece quando existe
    if (dados.medida) {
      x.font = 'bold 28px Arial, sans-serif';
      x.fillText(String(dados.medida).toUpperCase(), 14, y + 2);
      y += 34;
    }

    // O bloco de baixo se apoia na tarja de validade, não no fim do nome —
    // assim não sobra faixa branca quando o nome é curto.
    var base = H - 74;                       // topo da tarja preta
    var yEmp = base - 24, yCod = base - 52, yMan = base - 78;
    if (yMan < y + 4) { yMan = y + 4; yCod = yMan + 26; yEmp = yCod + 28; }

    x.font = '20px Arial, sans-serif';
    x.fillText('MANIP. ' + dh(dados.manipulado_em) + '  ' + String(dados.responsavel).split(' ')[0].toUpperCase(), 14, yMan);
    x.font = 'bold 24px Arial, sans-serif';
    x.fillText(codigo, 14, yCod);
    x.font = '16px Arial, sans-serif';
    x.fillText(EMPRESA_LINHA, 14, yEmp);
    x.fillRect(0, H - 74, W, 74);
    x.fillStyle = '#fff';
    x.font = 'bold 24px Arial, sans-serif';
    x.fillText('VALIDADE', 14, H - 58);
    x.font = 'bold 38px Arial, sans-serif';
    x.textAlign = 'right';
    x.fillText(dh(dados.validade), W - 14, H - 62);
    x.textAlign = 'left';
    return c;
  }

  function exemploPreview(){
    var s = (S.produto.label_shelf_lives || []).filter(function(z){ return z.storage_method === S.metodo; })[0];
    var agora = new Date();
    return { unidade:S.sessao.unidade.nome, produto:S.produto.name, conservacao:S.metodo,
      manipulado_em:agora.toISOString(),
      validade:new Date(agora.getTime() + s.shelf_life_hours * 3600000).toISOString(),
      responsavel:S.sessao.colaborador.nome, codigo:'AO-IMPRIMIR',
      medida:medidaTexto() };
  }

  // ---------- helpers de validade ----------

  function horasAte(iso){ return (new Date(iso).getTime() - Date.now()) / 3600000; }
  function classeDe(h){ return h < 0 ? 'venc' : (h < 24 ? 'hoje' : 'ok'); }
  function faltaTexto(h){
    if (h < 0) { var a = Math.abs(h); return a < 24 ? 'venceu há ' + Math.round(a) + 'h' : 'venceu há ' + Math.floor(a/24) + 'd'; }
    if (h < 1)  return 'menos de 1h';
    if (h < 24) return 'em ' + Math.round(h) + 'h';
    return 'em ' + Math.floor(h / 24) + 'd';
  }

  var UNIDADES = ['UN','KG','G','L','ML'];

  // A cozinha etiqueta quase sempre as mesmas coisas. Guardamos no aparelho
  // quantas vezes cada produto foi usado, para deixar os frequentes na frente.
  function freqLer(){
    try { return JSON.parse(localStorage.getItem('feitoria_freq') || '{}'); } catch(e){ return {}; }
  }
  function freqMarcar(id){
    try {
      var f = freqLer(); f[id] = (f[id] || 0) + 1;
      localStorage.setItem('feitoria_freq', JSON.stringify(f));
    } catch(e){}
  }

  // unidade sugerida vem do cadastro do produto (que veio da Takeat); UN é o padrão
  function unidadeSugerida(){
    var u = String((S.produto && S.produto.unit) || '').trim().toUpperCase();
    return UNIDADES.indexOf(u) >= 0 ? u : 'UN';
  }
  function medidaTexto(){
    var q = parseFloat(String(S.medQtd).replace(',', '.'));
    if (!isFinite(q) || q <= 0) return null;
    return String(q).replace('.', ',') + ' ' + (S.medUn || unidadeSugerida());
  }

  var DESTINOS = [
    { v:'consumido', t:'Consumido',        d:'saiu pela venda, sem perda' },
    { v:'sobra',     t:'Sobra',            d:'voltou ao estoque' },
    { v:'vencido',   t:'Descarte por validade', d:'passou do prazo' },
    { v:'quebra',    t:'Quebra ou erro',   d:'caiu, queimou, preparo errado' }
  ];

  function temDriver(){ return typeof window.Niimbot !== 'undefined'; }
  function acharNoRegistro(tipo, chave){
    var N = window.Niimbot; if (!N) return null;
    var fontes = [N.registry, N.REGISTRY, N.models, N.MODELS, N.sizes, N.SIZES];
    for (var i = 0; i < fontes.length; i++) {
      var f = fontes[i]; if (!f) continue;
      var alvo = f[tipo] || f;
      if (alvo && alvo[chave]) return alvo[chave];
    }
    return null;
  }
  function modelo(){
    var base = acharNoRegistro('models','B1_Pro') || acharNoRegistro('models','B1 Pro') || MODELO_FALLBACK;
    var copia = {}; for (var k in base) copia[k] = base[k];
    copia.density = S.dens;   // densidade escolhida na tela vence a do registro
    return copia;
  }
  function tamanho(){ return acharNoRegistro('sizes','T50x30') || TAM_FALLBACK; }

  function conectar(botao){
    if (!temDriver()) { S.btMsg = 'O driver da impressora não carregou. Confira a internet do aparelho.'; return render(); }
    if (!window.Niimbot.isSupported || !window.Niimbot.isSupported()) {
      S.btMsg = 'Este navegador não fala Bluetooth. Use o Chrome no Android ou no computador.'; return render();
    }
    // Transmissão mais conservadora no celular: o driver documenta que
    // aparelhos móveis derrubam rajadas grandes de pacotes BLE.
    try {
      if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
        window.Niimbot.PACE_MS = 16;
        window.Niimbot.BUNDLE_MAX = 180;
      }
    } catch(e){}

    botao.disabled = true; botao.textContent = 'Procurando...';
    window.Niimbot.identify(modelo())
      .then(function(info){
        S.bt = info || true;
        S.btMsg = '';
        try {
          var partes = [];
          if (info && info.model) partes.push(String(info.model));
          if (info && info.serial) partes.push('nº ' + info.serial);
          if (info && info.battery != null) partes.push('bateria ' + info.battery);
          S.btInfo = partes.join(' · ');
        } catch(e){ S.btInfo = ''; }
        render();
      })
      .catch(function(e){ S.btMsg = 'Não conectou: ' + (e && e.message ? e.message : e); render(); });
  }

  // Cada etiqueta é distinta (código próprio), então não dá para usar "cópias".
  function imprimir(etiquetas){
    if (!Array.isArray(etiquetas)) etiquetas = [etiquetas];
    var pngs = etiquetas.map(function(e){ return desenhar(e).toDataURL('image/png'); });

    if (S.bt && temDriver()) {
      if (window.Niimbot.printBatch && pngs.length > 1) {
        return window.Niimbot.printBatch(pngs, { model:modelo(), size:tamanho() });
      }
      return pngs.reduce(function(fila, png){
        return fila.then(function(){
          return window.Niimbot.printImage(png, { model:modelo(), size:tamanho(), copies:1 });
        });
      }, Promise.resolve());
    }

    document.getElementById('folha').innerHTML =
      pngs.map(function(p){ return '<img src="' + p + '">'; }).join('');
    return new Promise(function(ok){ setTimeout(function(){ window.print(); ok(); }, 120); });
  }

  function barraImpressora(){
    var ligada = !!S.bt;
    var dens = '';
    if (ligada) {
      dens = '<select id="f-dens" title="Densidade">';
      for (var d = 1; d <= 5; d++) {
        dens += '<option value="' + d + '"' + (d === S.dens ? ' selected' : '') + '>' +
                'Densidade ' + d + '</option>';
      }
      dens += '</select>';
    }
    return '<div class="imp' + (ligada ? ' on' : '') + '"><div class="dotp"></div>' +
      '<span>' + (ligada
        ? 'NIIMBOT B1 Pro conectada' + (S.btInfo ? ' — ' + esc(S.btInfo) : '')
        : 'Impressora não conectada — sai pelo navegador') + '</span>' +
      dens +
      (ligada ? '<button data-a="teste">Teste</button>' : '<button data-a="conectar">Conectar</button>') +
      '</div>' + (S.btMsg ? '<div class="msg w">' + esc(S.btMsg) + '</div>' : '');
  }

  function telaPin(){
    var dots = '';
    for (var i = 0; i < 6; i++) dots += '<div class="dot' + (i < S.pin.length ? ' on' : '') + '"></div>';
    var teclas = '';
    for (var n = 1; n <= 9; n++) teclas += '<button data-d="' + n + '">' + n + '</button>';
    teclas += '<button class="wide" data-a="limpar">limpar</button><button data-d="0">0</button>' +
              '<button class="wide" data-a="apagar">apagar</button>';
    return '<div class="pinbox"><h1>Etiquetas</h1><p class="sub">Digite seu PIN para começar</p>' +
      (S.erro ? '<div class="msg e">' + esc(S.erro) + '</div>' : '') +
      '<div class="dots">' + dots + '</div><div class="pad">' + teclas + '</div>' +
      '<button class="big" data-a="entrar"' + (S.pin.length < 4 ? ' disabled' : '') + '>Entrar</button></div>';
  }

  function cabecalho(){
    return '<div class="top"><div><b>' + esc(S.sessao.colaborador.nome.split(' ')[0]) + '</b>' +
      '<small>' + esc(S.sessao.unidade.nome) + '</small></div>' +
      '<button class="link" data-a="sair">Sair</button></div>' + barraImpressora();
  }

  function cartaoProduto(p){
    var n = (p.label_shelf_lives || []).length;
    return '<button class="card" data-p="' + esc(p.id) + '">' + esc(p.name) +
      '<small>' + n + (n === 1 ? ' forma de guardar' : ' formas de guardar') + '</small></button>';
  }

  function telaProduto(){
    var termo = S.busca.trim().toLowerCase();
    var lista = S.sessao.produtos.filter(function(p){ return !termo || p.name.toLowerCase().indexOf(termo) >= 0; });
    var grupos = {}, ordem = [];
    lista.forEach(function(p){ var c = p.category || 'Outros';
      if (!grupos[c]) { grupos[c] = []; ordem.push(c); } grupos[c].push(p); });
    var corpo = '';

    // Frequentes primeiro — só quando não há busca, para não brigar com o filtro
    if (!termo) {
      var f = freqLer();
      var freq = lista.filter(function(p){ return f[p.id]; })
                      .sort(function(a, b){ return f[b.id] - f[a.id]; })
                      .slice(0, 6);
      if (freq.length) {
        corpo += '<div class="cat">Mais usados aqui</div><div class="grid">' +
                 freq.map(cartaoProduto).join('') + '</div>';
      }
    }
    ordem.forEach(function(c){
      corpo += '<div class="cat">' + esc(c) + '</div><div class="grid">' +
               grupos[c].map(cartaoProduto).join('') + '</div>';
    });
    if (!lista.length) corpo = '<p class="sub">Nenhum produto encontrado.</p>';
    return cabecalho() + navegacao('etiquetar') +
      (S.aviso
        ? '<div class="msg s"><div class="aviso-acao"><span>' + esc(S.aviso) + '</span>' +
          (S.ultima ? '<button data-a="repetir">Imprimir de novo</button>' : '') + '</div></div>'
        : '') +
      '<h1>O que você vai etiquetar?</h1>' +
      '<input class="search" id="busca" placeholder="Buscar produto" value="' + esc(S.busca) + '" autocomplete="off">' +
      corpo +
      '<button class="big ghost" data-a="ir" data-t="avulso">Item fora da lista</button>';
  }

  function telaMetodo(){
    var opcoes = '';
    (S.produto.label_shelf_lives || []).forEach(function(s){
      var m = METODOS[s.storage_method] || { nome:s.storage_method, dica:'' };
      opcoes += '<button class="card" data-m="' + esc(s.storage_method) + '">' + esc(m.nome) +
        ' — ' + prazoTexto(s.shelf_life_hours) + '<small>' + esc(m.dica) + '</small></button>';
    });
    return cabecalho() + '<h1>' + esc(S.produto.name) + '</h1>' +
      '<p class="sub">Como vai ser guardado?</p><div class="grid">' + opcoes + '</div>' +
      '<button class="big ghost" data-a="voltar">Voltar</button>';
  }

  function telaConfirmar(){
    return cabecalho() + (S.erro ? '<div class="msg e">' + esc(S.erro) + '</div>' : '') +
      '<h1>Conferir e imprimir</h1>' +
      '<p class="sub">Prévia em tamanho real (50 × 30 mm). O lote e a validade saem do servidor.</p>' +
      '<canvas id="prev"></canvas>' +
      '<label class="switch"><input type="checkbox" id="f-porcao"' + (S.porcaoOn ? ' checked' : '') + '>' +
        '<span>Informar porção ou quantidade</span></label>' +
      (S.porcaoOn
        ? '<div class="campo"><div class="dupla">' +
            '<input id="f-qtd" type="number" inputmode="decimal" step="0.001" min="0" ' +
              'value="' + esc(S.medQtd) + '" placeholder="Ex: 80" autocomplete="off">' +
            '<select id="f-un">' +
              UNIDADES.map(function(u){
                var sel = (S.medUn || unidadeSugerida()) === u ? ' selected' : '';
                return '<option value="' + u + '"' + sel + '>' + u + '</option>';
              }).join('') +
            '</select>' +
          '</div></div>'
        : '') +
      '<div class="qty"><button data-a="menos">-</button><span>' + S.qtd + '</span><button data-a="mais">+</button></div>' +
      '<p class="sub" style="text-align:center;margin:-8px 0 0">etiquetas a imprimir</p>' +
      '<button class="big ghost" data-a="voltar">Voltar</button>' +
      '<div class="acoes"><button class="big" data-a="imprimir">Imprimir ' + S.qtd +
        (S.qtd === 1 ? ' etiqueta' : ' etiquetas') + '</button></div>';
  }

  function navegacao(atual){
    return '<div class="nav">' +
      '<button data-a="ir" data-t="produto"' + (atual === 'etiquetar' ? ' class="on"' : '') + '>Etiquetar</button>' +
      '<button data-a="ir" data-t="validades"' + (atual === 'validades' ? ' class="on"' : '') + '>Validades</button>' +
      '</div>';
  }

  function telaValidades(){
    var corpo;
    if (S.carregando) corpo = '<p class="sub">Carregando…</p>';
    else if (!S.itens.length) corpo = '<p class="sub">Nenhum item etiquetado em circulação.</p>';
    else {
      var venc = 0, hoje = 0;
      S.itens.forEach(function(i){ var h = horasAte(i.expires_at); if (h < 0) venc++; else if (h < 24) hoje++; });
      corpo = '<p class="sub">' + venc + ' vencido(s) · ' + hoje + ' vencem em 24h · ' +
              S.itens.length + ' em circulação</p><div class="val">' +
        S.itens.map(function(i){
          var h = horasAte(i.expires_at);
          return '<button class="vitem ' + classeDe(h) + '" data-a="abrir" data-c="' + esc(i.code) + '">' +
            '<div class="b"></div>' +
            '<div class="n">' + esc(i.product_name) +
              '<em>' + esc(i.code) + ' · ' + esc((METODOS[i.storage_method]||{}).nome || i.storage_method) + '</em></div>' +
            '<div class="p">' + faltaTexto(h) + '<br><span style="font-weight:400;color:var(--muted);font-size:12px">' +
              dh(i.expires_at) + '</span></div></button>';
        }).join('') + '</div>';
    }

    return cabecalho() + navegacao('validades') +
      (S.aviso ? '<div class="msg s">' + esc(S.aviso) + '</div>' : '') +
      (S.erro ? '<div class="msg e">' + esc(S.erro) + '</div>' : '') +
      '<h1>O que está na geladeira</h1>' +
      '<div class="campo"><div class="dupla">' +
        '<button class="btn big" style="margin:0" data-a="scan">Ler QR da etiqueta</button>' +
        '<input id="cod" placeholder="ou digite o código" autocomplete="off" style="width:100%;padding:14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)">' +
      '</div></div>' +
      '<video id="leitor" playsinline></video>' +
      corpo;
  }

  function telaItem(){
    var i = S.item;
    var h = horasAte(i.expires_at);
    var m = METODOS[i.storage_method] || { nome:i.storage_method };
    var prazos = ((i.label_products || {}).label_shelf_lives || [])
      .filter(function(s){ return s.storage_method !== i.storage_method; });

    return cabecalho() +
      (S.erro ? '<div class="msg e">' + esc(S.erro) + '</div>' : '') +
      '<div class="ficha"><h2>' + esc(i.product_name) + '</h2>' +
        '<span class="sub" style="margin:0">' + esc(i.code) + '</span>' +
        '<dl>' +
          '<dt>Conservação</dt><dd>' + esc(m.nome) + '</dd>' +
          '<dt>Manipulado</dt><dd>' + dh(i.manipulated_at) + ' · ' + esc(String(i.employee_name).split(' ')[0]) + '</dd>' +
          '<dt>Validade</dt><dd><b>' + dh(i.expires_at) + '</b> (' + faltaTexto(h) + ')</dd>' +
          '<dt>Situação</dt><dd>' + (i.status !== 'ativo' ? esc(i.status) : (h < 0 ? 'vencido' : 'ativo')) + '</dd>' +
        '</dl></div>' +

      (i.status !== 'ativo'
        ? '<div class="msg w">Esta etiqueta já saiu de circulação.</div>'
        : '<h1 style="font-size:18px;margin:22px 0 4px">Dar baixa</h1>' +
          '<p class="sub">O que aconteceu com este item?</p>' +
          '<div class="destinos">' +
            DESTINOS.map(function(d){
              return '<button class="card" data-a="baixa" data-c="' + esc(i.code) + '" data-v="' + d.v + '">' +
                d.t + '<small>' + d.d + '</small></button>';
            }).join('') +
          '</div>' +
          (h >= 0 && prazos.length
            ? '<h1 style="font-size:18px;margin:22px 0 4px">Revalidar</h1>' +
              '<p class="sub">Mudou de conservação? Gera uma etiqueta nova, ligada a esta.</p>' +
              '<div class="destinos">' +
                prazos.map(function(s){
                  var mm = METODOS[s.storage_method] || { nome:s.storage_method };
                  return '<button class="card" data-a="reval" data-c="' + esc(i.code) + '" data-v="' + esc(s.storage_method) + '">' +
                    esc(mm.nome) + ' — ' + prazoTexto(s.shelf_life_hours) +
                    '<small>validade recomeça agora</small></button>';
                }).join('') +
              '</div>'
            : '')) +

      '<button class="big ghost" data-a="ir" data-t="validades">Voltar</button>';
  }

  function telaAvulso(){
    var opts = ['ambiente','refrigerado','congelado','descongelado'].map(function(k){
      return '<option value="' + k + '"' + (S.av.metodo === k ? ' selected' : '') + '>' + METODOS[k].nome + '</option>';
    }).join('');

    return cabecalho() +
      (S.erro ? '<div class="msg e">' + esc(S.erro) + '</div>' : '') +
      '<h1>Item fora da lista</h1>' +
      '<p class="sub">Use quando o preparo ainda não está cadastrado. Ele entra marcado como avulso e aparece na fila para regularizar na Takeat.</p>' +
      '<div class="campo"><label>Nome do item</label>' +
        '<input id="av-nome" value="' + esc(S.av.nome) + '" placeholder="Ex: Molho de pimenta da casa" autocomplete="off"></div>' +
      '<div class="campo dupla">' +
        '<div><label>Como vai guardar</label><select id="av-metodo">' + opts + '</select></div>' +
        '<div><label>Validade (dias)</label><input id="av-dias" type="number" min="1" max="180" value="' + S.av.dias + '"></div>' +
      '</div>' +
      '<div class="campo dupla">' +
        '<div><label>Quantas etiquetas</label><input id="av-qtd" type="number" min="1" max="20" value="' + S.av.qtd + '"></div>' +
        '<div><label>Porção — opcional</label>' +
          '<div class="dupla"><input id="av-qtd" type="number" inputmode="decimal" step="0.001" min="0" placeholder="Qtd">' +
          '<select id="av-un">' + UNIDADES.map(function(u){
            return '<option value="' + u + '">' + u + '</option>'; }).join('') + '</select></div></div>' +
      '</div>' +
      '<button class="big" data-a="salvar-avulso">Gerar e imprimir</button>' +
      '<button class="big ghost" data-a="ir" data-t="produto">Voltar</button>';
  }

  function render(){
    if (!TOKEN) { app.innerHTML = '<div class="msg e">Link inválido. Peça o link da sua unidade à gerência.</div>'; return; }
    if (S.tela === 'pin') app.innerHTML = telaPin();
    else if (S.tela === 'produto') app.innerHTML = telaProduto();
    else if (S.tela === 'metodo') app.innerHTML = telaMetodo();
    else if (S.tela === 'validades') app.innerHTML = telaValidades();
    else if (S.tela === 'item') app.innerHTML = telaItem();
    else if (S.tela === 'avulso') app.innerHTML = telaAvulso();
    else app.innerHTML = telaConfirmar();

    var cod = document.getElementById('cod');
    if (cod) cod.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && cod.value.trim()) abrirItem(cod.value.trim());
    });
    var cv = document.getElementById('prev');
    if (cv) desenhar(exemploPreview(), cv);

    var fp = document.getElementById('f-porcao');
    if (fp) fp.addEventListener('change', function(){
      S.porcaoOn = fp.checked;
      if (!S.porcaoOn) { S.medQtd = ''; S.medUn = ''; }   // desmarcou, não vai medida nenhuma
      render();
    });

    // a prévia acompanha o que se digita, então dá para ver se cabe antes de imprimir
    function ligarPreview(el, campo){
      if (!el) return;
      el.addEventListener(campo === 'medUn' ? 'change' : 'input', function(){
        S[campo] = el.value;
        var cvv = document.getElementById('prev');
        if (cvv) desenhar(exemploPreview(), cvv);
      });
    }
    ligarPreview(document.getElementById('f-qtd'), 'medQtd');
    ligarPreview(document.getElementById('f-un'), 'medUn');
    var sd = document.getElementById('f-dens');
    if (sd) sd.addEventListener('change', function(){
      S.dens = parseInt(sd.value, 10) || 3;
      try { localStorage.setItem('feitoria_densidade', String(S.dens)); } catch(e){}
      S.btMsg = 'Densidade ' + S.dens + ' — imprima um teste para conferir.';
      render();
    });

    var b = document.getElementById('busca');
    if (b) b.addEventListener('input', function(){
      S.busca = b.value; var p = b.selectionStart; render();
      var n = document.getElementById('busca'); if (n) { n.focus(); n.setSelectionRange(p, p); }
    });
  }

  function carregarItens(){
    S.carregando = true; S.erro = ''; render();
    return chamar({ action:'itens', unit_token:TOKEN, pin:S.pin })
      .then(function(j){ S.itens = j.itens || []; })
      .catch(function(e){ S.erro = e.message; })
      .then(function(){ S.carregando = false; toque(); render(); });
  }

  function abrirItem(codigo){
    S.erro = ''; S.aviso = '';
    return chamar({ action:'item', unit_token:TOKEN, pin:S.pin, code:codigo })
      .then(function(j){ S.item = j.item; S.tela = 'item'; toque(); render(); })
      .catch(function(e){ S.erro = e.message; render(); });
  }

  // Leitura do QR pela câmera. Só existe no Chrome Android; sem ele, digita-se o código.
  function escanear(botao){
    var video = document.getElementById('leitor');
    if (!('BarcodeDetector' in window) || !video) {
      S.erro = 'Este aparelho não lê QR pela câmera. Digite o código da etiqueta.';
      return render();
    }
    botao.disabled = true; botao.textContent = 'Abrindo câmera…';
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } })
      .then(function(stream){
        video.style.display = 'block';
        video.srcObject = stream; video.play();
        var det = new window.BarcodeDetector({ formats:['qr_code'] });
        var parar = function(){
          stream.getTracks().forEach(function(t){ t.stop(); });
          video.style.display = 'none';
        };
        var tick = function(){
          if (!stream.active) return;
          det.detect(video).then(function(r){
            if (r && r.length) { parar(); abrirItem(r[0].rawValue); }
            else setTimeout(tick, 350);
          }).catch(function(){ setTimeout(tick, 500); });
        };
        setTimeout(tick, 600);
        setTimeout(function(){ if (stream.active) { parar(); render(); } }, 45000);
      })
      .catch(function(e){ S.erro = 'Não consegui abrir a câmera: ' + e.message; render(); });
  }

  document.addEventListener('click', function(ev){
    var el = ev.target.closest('button'); if (!el) return;
    var d = el.getAttribute('data-d'), a = el.getAttribute('data-a');
    var p = el.getAttribute('data-p'), m = el.getAttribute('data-m');

    if (d !== null && d !== undefined) { if (S.pin.length < 6) S.pin += d; S.erro=''; return render(); }

    if (p) {
      S.produto = S.sessao.produtos.filter(function(z){ return z.id === p; })[0];
      S.aviso = ''; S.porcaoOn = false; S.medQtd = ''; S.medUn = '';
      var prazos = S.produto.label_shelf_lives || [];
      if (!prazos.length) { S.erro = 'Esse produto ainda não tem prazo cadastrado. Fale com a gerência.'; return render(); }
      if (prazos.length === 1) { S.metodo = prazos[0].storage_method; S.qtd = 1; S.tela = 'confirmar'; }
      else S.tela = 'metodo';
      toque(); return render();
    }
    if (m) { S.metodo = m; S.qtd = 1; S.tela = 'confirmar'; toque(); return render(); }

    if (a === 'limpar') { S.pin = ''; return render(); }
    if (a === 'apagar') { S.pin = S.pin.slice(0, -1); return render(); }
    if (a === 'sair') return sair();
    if (a === 'menos') { if (S.qtd > 1) S.qtd--; return render(); }
    if (a === 'mais')  { if (S.qtd < 20) S.qtd++; return render(); }
    if (a === 'conectar') return conectar(el);
    if (a === 'scan') return escanear(el);

    // repete a última etiqueta sem refazer o caminho todo — o caso mais comum
    if (a === 'repetir') {
      if (!S.ultima) return;
      S.produto = S.ultima.produto; S.metodo = S.ultima.metodo; S.qtd = S.ultima.qtd;
      S.medQtd = S.ultima.medQtd; S.medUn = S.ultima.medUn; S.porcaoOn = S.ultima.porcaoOn;
      S.tela = 'confirmar'; S.aviso = ''; S.erro = '';
      toque(); return render();
    }

    if (a === 'ir') {
      var destino = el.getAttribute('data-t');
      S.erro = ''; S.aviso = '';
      if (destino === 'validades') { S.tela = 'validades'; return carregarItens(); }
      S.tela = destino; toque(); return render();
    }

    if (a === 'abrir') return abrirItem(el.getAttribute('data-c'));

    if (a === 'baixa') {
      el.disabled = true;
      chamar({ action:'baixa', unit_token:TOKEN, pin:S.pin,
               code:el.getAttribute('data-c'), outcome:el.getAttribute('data-v') })
        .then(function(j){
          S.aviso = 'Baixa registrada: ' + j.codigo + ' — ' + j.destino + '.';
          S.item = null; S.tela = 'validades'; return carregarItens();
        })
        .catch(function(e){ S.erro = e.message; render(); });
      return;
    }

    if (a === 'reval') {
      el.disabled = true; el.textContent = 'Gerando…';
      chamar({ action:'revalidar', unit_token:TOKEN, pin:S.pin,
               code:el.getAttribute('data-c'), storage_method:el.getAttribute('data-v') })
        .then(function(j){ return imprimir(j.etiquetas).then(function(){ return j; }); })
        .then(function(j){
          S.aviso = 'Revalidado: ' + j.origem + ' virou ' + j.etiqueta.codigo + '. Cole a etiqueta nova e tire a antiga.';
          S.item = null; S.tela = 'validades'; return carregarItens();
        })
        .catch(function(e){ S.erro = e.message; render(); });
      return;
    }

    if (a === 'salvar-avulso') {
      S.av.nome = (document.getElementById('av-nome').value || '').trim();
      S.av.metodo = document.getElementById('av-metodo').value;
      S.av.dias = parseInt(document.getElementById('av-dias').value, 10) || 1;
      S.av.qtd = parseInt(document.getElementById('av-qtd').value, 10) || 1;

      if (S.av.nome.length < 2) { S.erro = 'Informe o nome do item.'; return render(); }
      el.disabled = true; el.textContent = 'Gerando…';
      var avq = document.getElementById('av-qtd'), avu = document.getElementById('av-un');
      chamar({ action:'avulso', unit_token:TOKEN, pin:S.pin, nome:S.av.nome,
               storage_method:S.av.metodo, horas:S.av.dias * 24, quantity:S.av.qtd,
               medida_qtd: avq ? avq.value : '', medida_un: avu ? avu.value : 'UN' })
        .then(function(j){ return imprimir(j.etiquetas).then(function(){ return j; }); })
        .then(function(j){
          S.aviso = j.etiquetas.length + ' etiqueta(s) — ' + j.etiqueta.produto + ' (avulso, a regularizar na Takeat).';
          S.av = { nome:'', metodo:'refrigerado', dias:3, qtd:1 };
          S.tela = 'produto'; S.erro = '';
          // recarrega a sessão para o item novo aparecer na lista
          return chamar({ action:'session', unit_token:TOKEN, pin:S.pin })
            .then(function(s){ S.sessao = s; toque(); render(); });
        })
        .catch(function(e){ S.erro = e.message; render(); });
      return;
    }

    if (a === 'teste') {
      el.disabled = true; el.textContent = '...';
      imprimir([{ unidade:S.sessao ? S.sessao.unidade.nome : 'FEITORIA', produto:'Teste de impressão',
        conservacao:'refrigerado', manipulado_em:new Date().toISOString(),
        validade:new Date(Date.now() + 259200000).toISOString(),
        responsavel:'Teste', codigo:'TESTE-000-1' }])
        .then(function(){ el.disabled = false; el.textContent = 'Teste'; })
        .catch(function(e){ S.btMsg = 'Falhou: ' + (e && e.message ? e.message : e); render(); });
      return;
    }

    if (a === 'voltar') {
      S.tela = (S.tela === 'confirmar' && (S.produto.label_shelf_lives || []).length > 1) ? 'metodo' : 'produto';
      return render();
    }

    if (a === 'entrar') {
      el.disabled = true; el.textContent = 'Entrando...';
      chamar({ action:'session', unit_token:TOKEN, pin:S.pin })
        .then(function(j){ S.sessao = j; S.tela = 'produto'; S.erro = ''; toque(); render(); })
        .catch(function(e){ S.erro = e.message; S.pin = ''; render(); });
      return;
    }

    if (a === 'imprimir') {
      var qtd = S.qtd;
      el.disabled = true; el.textContent = 'Imprimindo...';
      chamar({ action:'print', unit_token:TOKEN, pin:S.pin, product_id:S.produto.id,
               storage_method:S.metodo, quantity:qtd,
               medida_qtd:S.medQtd, medida_un:S.medUn || unidadeSugerida() })
        .then(function(j){ return imprimir(j.etiquetas).then(function(){ return j; }); })
        .then(function(j){
          freqMarcar(S.produto.id);
          S.ultima = { produto:S.produto, metodo:S.metodo, qtd:qtd,
                       medQtd:S.medQtd, medUn:S.medUn, porcaoOn:S.porcaoOn };
          S.aviso = qtd + (qtd === 1 ? ' etiqueta' : ' etiquetas') + ' — ' + j.etiqueta.produto +
                    (j.etiqueta.medida ? ' (' + j.etiqueta.medida + ')' : '') +
                    ' · ' + j.etiquetas[0].codigo +
                    (qtd > 1 ? ' até ' + j.etiquetas[qtd - 1].codigo : '');
          S.tela = 'produto'; S.produto = null; S.metodo = null; S.busca = '';
          S.medQtd = ''; S.medUn = ''; S.erro = '';
          toque(); render();
          setTimeout(function(){ S.aviso = ''; if (S.tela === 'produto') render(); }, 7000);
        })
        .catch(function(e){ S.erro = e.message || String(e); render(); });
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if (S.tela !== 'pin') return;
    if (e.key >= '0' && e.key <= '9' && S.pin.length < 6) { S.pin += e.key; render(); }
    else if (e.key === 'Backspace') { S.pin = S.pin.slice(0, -1); render(); }
    else if (e.key === 'Enter' && S.pin.length >= 4) { var b = document.querySelector('[data-a="entrar"]'); if (b) b.click(); }
  });

  try {
    var g = JSON.parse(sessionStorage.getItem('feitoria') || 'null');
    if (g && Date.now() - g.t < EXPIRA) { S.pin = g.pin; S.sessao = g.sessao; S.tela = 'produto'; S.ultimo = g.t; }
  } catch(e){}

  render();
})();
</script>
</body>
</html>
