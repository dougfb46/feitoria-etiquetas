<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validades na cozinha — Feitoria</title>
<style>
  :root{
    --fundo:#0A0F0C; --caixa:#141B16; --linha:#232E27;
    --texto:#F2F7F3; --fraco:#8DA096;
    --ok:#3FBF7F; --atencao:#E8C33D; --urgente:#F08A2E; --vencido:#E8503C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--fundo);color:var(--texto);
       font:400 1rem/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;padding:2vh 2vw 0}

  /* ---------- cabeçalho fixo ---------- */
  header{flex:0 0 auto}
  .topo{display:flex;justify-content:space-between;align-items:flex-start;
        border-bottom:2px solid var(--linha);padding-bottom:1.2vh}
  .marca small{display:block;font-size:1.1vw;font-weight:600;color:var(--fraco);
               letter-spacing:.18em;text-transform:uppercase;margin-bottom:.5vh}
  .marca h1{font-size:2.9vw;font-weight:700;letter-spacing:-.015em;line-height:1}
  .relogio{text-align:right}
  .relogio b{display:block;font-size:4.2vw;font-weight:700;line-height:.95;
             font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .relogio span{font-size:1.15vw;color:var(--fraco)}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vw;margin:1.6vh 0}
  .card{background:var(--caixa);border-radius:.7vw;padding:1.5vh 1.4vw;
        border-left:.45vw solid var(--linha);display:flex;align-items:baseline;gap:1vw}
  .card b{font-size:3.6vw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .card span{font-size:1.05vw;color:var(--fraco);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .card.v{border-left-color:var(--vencido)}  .card.v b{color:var(--vencido)}
  .card.a{border-left-color:var(--atencao)}  .card.a b{color:var(--atencao)}
  .card.o{border-left-color:var(--ok)}       .card.o b{color:var(--ok)}

  /* ---------- área que rola ---------- */
  .palco{flex:1 1 auto;position:relative;overflow:hidden;
         -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 2.2%,#000 97.8%,transparent 100%);
                mask-image:linear-gradient(180deg,transparent 0,#000 2.2%,#000 97.8%,transparent 100%)}
  .trilho{position:absolute;top:0;left:0;right:0;will-change:transform}
  .bloco{display:grid;gap:.85vh;padding-bottom:.85vh}

  .item{display:grid;grid-template-columns:.5vw 1fr auto auto;gap:1.3vw;align-items:center;
        background:var(--caixa);border-radius:.55vw;padding:1.35vh 1.4vw;min-height:8.4vh}
  .barra{width:.5vw;align-self:stretch;border-radius:.3vw;background:var(--ok)}
  .nome{min-width:0}
  .nome b{display:block;font-size:2vw;font-weight:600;line-height:1.1;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nome em{display:block;font-style:normal;font-size:1.05vw;font-weight:500;color:var(--fraco);
           letter-spacing:.09em;text-transform:uppercase;margin-top:.5vh;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nome em i{font-style:normal;opacity:.62}
  .estado{font-size:1.85vw;font-weight:700;text-align:right;white-space:nowrap;
          font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .quando{font-size:1.25vw;color:var(--fraco);text-align:right;white-space:nowrap;
          font-variant-numeric:tabular-nums;min-width:9.5vw}

  .vencido .barra{background:var(--vencido)} .vencido .estado{color:var(--vencido)}
  .urgente .barra{background:var(--urgente)} .urgente .estado{color:var(--urgente)}
  .atencao .barra{background:var(--atencao)} .atencao .estado{color:var(--atencao)}
  .normal  .barra{background:var(--ok)}      .normal  .estado{color:var(--fraco);font-weight:600}

  .vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;
         height:60vh;text-align:center}
  .vazio b{font-size:3.4vw;color:var(--ok);font-weight:700;margin-bottom:1.4vh}
  .vazio span{font-size:1.4vw;color:var(--fraco)}

  footer{flex:0 0 auto;display:flex;justify-content:space-between;
         border-top:1px solid var(--linha);padding:1.1vh 0 1.4vh;
         font-size:1.05vw;color:var(--fraco)}

  .pisca{animation:p 2.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
  @media (prefers-reduced-motion:reduce){.pisca{animation:none}}
</style>
</head>
<body>

<header>
  <div class="topo">
    <div class="marca"><small id="uni">Feitoria da Cerveja</small><h1>Validades na cozinha</h1></div>
    <div class="relogio"><b id="hora">--:--</b><span id="data">—</span></div>
  </div>
  <div class="cards">
    <div class="card v"><b id="c-venc">0</b><span>Vencidos</span></div>
    <div class="card a"><b id="c-aten">0</b><span>Em atenção</span></div>
    <div class="card o"><b id="c-ativ">0</b><span>Etiquetas ativas</span></div>
  </div>
</header>

<div class="palco" id="palco"><div class="trilho" id="trilho"></div></div>

<footer>
  <span id="rodape">Carregando…</span>
  <span id="status">Feitoria · controle de validade</span>
</footer>

<script>
(function(){
  var API  = 'https://kujelbcbrcmkitzyswbh.supabase.co/functions/v1/painel';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1amVsYmNicmNta2l0enlzd2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDg0MzAsImV4cCI6MjEwNDIyNDQzMH0.uDwckXtywDBZGU_i4J8S9BdO2fUtRwXCOaLJbSiWzdQ';

  var q = new URLSearchParams(location.search);
  var TOKEN = q.get('u') || '';
  var VELOCIDADE = Math.min(Math.max(parseFloat(q.get('vel')) || 28, 10), 80); // px/s

  // ---------------------------------------------------------------
  // Janelas de atenção por tipo de conservação. Mexer só aqui.
  // alerta  = a partir de quantas horas antes o item entra em ATENÇÃO
  // urgente = a partir de quantas horas antes ele vira URGENTE
  // ---------------------------------------------------------------
  var REGRAS = {
    refrigerado:  { alertaHoras:  24, urgenteHoras:  4, nome:'Refrigerado'  },
    resfriado:    { alertaHoras:  24, urgenteHoras:  4, nome:'Resfriado'    },
    descongelado: { alertaHoras:  12, urgenteHoras:  4, nome:'Descongelado' },
    congelado:    { alertaHoras:  72, urgenteHoras: 24, nome:'Congelado'    },
    ambiente:     { alertaHoras: 168, urgenteHoras: 48, nome:'Ambiente'     }
  };
  var PADRAO = { alertaHoras: 24, urgenteHoras: 4, nome:'—' };
  var regra = function(m){ return REGRAS[m] || PADRAO; };

  var PESO = { vencido:0, urgente:1, atencao:2, normal:3 };
  var dados = null, assinatura = '', animando = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

  function relogio(){
    var d = new Date();
    document.getElementById('hora').textContent =
      d.toLocaleTimeString('pt-BR', { timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit' });
    document.getElementById('data').textContent =
      d.toLocaleDateString('pt-BR', { timeZone:'America/Sao_Paulo',
        weekday:'long', day:'2-digit', month:'long' });
  }

  function classificar(horas, metodo){
    if (horas < 0) return 'vencido';
    var r = regra(metodo);
    if (horas <= r.urgenteHoras) return 'urgente';
    if (horas <= r.alertaHoras)  return 'atencao';
    return 'normal';
  }

  // Nunca diz "menos de 1h" para algo que já venceu: passado e futuro têm textos próprios.
  function textoEstado(horas, estado){
    if (estado === 'vencido') {
      var a = Math.abs(horas);
      if (a < 1)  return 'VENCEU AGORA';
      if (a < 24) return 'VENCIDO HÁ ' + relogioCurto(a);
      var d = Math.floor(a / 24);
      return 'VENCIDO HÁ ' + d + (d === 1 ? ' DIA' : ' DIAS');
    }
    if (estado === 'normal') {
      if (horas < 48) return Math.round(horas) + 'H RESTANTES';
      return Math.floor(horas / 24) + ' DIAS RESTANTES';
    }
    if (horas < 1)  return 'VENCE EM ' + Math.max(1, Math.round(horas * 60)) + ' MIN';
    if (horas < 24) return 'VENCE EM ' + relogioCurto(horas);
    if (horas < 48) return 'VENCE AMANHÃ';
    return 'VENCE EM ' + Math.floor(horas / 24) + ' DIAS';
  }

  function relogioCurto(h){
    var inteiras = Math.floor(h);
    var min = Math.round((h - inteiras) * 60);
    if (min === 60) { inteiras += 1; min = 0; }
    return inteiras + 'H' + (min ? ' ' + min + 'MIN' : '');
  }

  function quando(iso){
    return new Date(iso).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo',
      day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
      .replace(',', ' ·');
  }

  function primeiroNome(s){
    var n = String(s || '').trim().split(/\s+/)[0] || '';
    return n && n.toLowerCase() !== 'teste' ? n : '';
  }

  function linha(i){
    var pisca = i._estado === 'vencido' ? ' pisca' : '';
    var quem = primeiroNome(i.employee_name);
    return '<div class="item ' + i._estado + '">' +
      '<div class="barra' + pisca + '"></div>' +
      '<div class="nome"><b>' + esc(i.product_name) +
        (i.medida ? ' <i style="font-weight:400;color:var(--fraco)">' + esc(i.medida) + '</i>' : '') +
        '</b><em>' + esc(regra(i.storage_method).nome) + ' · ' + esc(i.code) +
        (quem ? ' · <i>' + esc(quem) + '</i>' : '') + '</em></div>' +
      '<div class="estado' + pisca + '" data-c="' + esc(i.code) + '">' + esc(i._texto) + '</div>' +
      '<div class="quando">' + esc(quando(i.expires_at)) + '</div>' +
    '</div>';
  }

  function pararAnimacao(){
    if (animando) { cancelAnimationFrame(animando); animando = null; }
  }

  // Rolagem contínua: dois blocos idênticos e um deslocamento que volta a zero
  // exatamente na altura de um bloco — o olho não vê emenda.
  function rolar(trilho, palco){
    pararAnimacao();
    trilho.style.transform = 'translateY(0)';
    var alturaBloco = trilho.firstElementChild ? trilho.firstElementChild.offsetHeight : 0;
    if (!alturaBloco || alturaBloco <= palco.clientHeight) return;   // cabe na tela: não rola

    var y = 0, anterior = null;
    var passo = function(t){
      if (anterior === null) anterior = t;
      y += VELOCIDADE * (t - anterior) / 1000;
      anterior = t;
      if (y >= alturaBloco) y -= alturaBloco;
      trilho.style.transform = 'translateY(' + (-y) + 'px)';
      animando = requestAnimationFrame(passo);
    };
    animando = requestAnimationFrame(passo);
  }

  function desenhar(){
    if (!dados) return;
    document.getElementById('uni').textContent = dados.unidade;

    var itens = (dados.todos || []).map(function(i){
      var h = Number(i.horas_restantes);
      var e = classificar(h, i.storage_method);
      return Object.assign({}, i, { _horas:h, _estado:e, _texto:textoEstado(h, e) });
    });

    // Criticidade primeiro; dentro de cada grupo, o que vence antes vem antes.
    // Nos vencidos isso coloca o mais antigo no topo, que é o que urge descartar.
    itens.sort(function(a, b){
      return (PESO[a._estado] - PESO[b._estado]) || (a._horas - b._horas);
    });

    var vencidos = itens.filter(function(i){ return i._estado === 'vencido'; }).length;
    var atencao  = itens.filter(function(i){
      return i._estado === 'urgente' || i._estado === 'atencao'; }).length;

    document.getElementById('c-venc').textContent = vencidos;
    document.getElementById('c-aten').textContent = atencao;
    document.getElementById('c-ativ').textContent = itens.length;

    var palco  = document.getElementById('palco');
    var trilho = document.getElementById('trilho');

    if (!itens.length) {
      pararAnimacao();
      trilho.style.transform = 'translateY(0)';
      trilho.innerHTML = '<div class="vazio"><b>Tudo em dia</b>' +
        '<span>Nenhuma etiqueta ativa na cozinha.</span></div>';
      document.getElementById('rodape').textContent = 'nenhuma etiqueta em circulação';
      assinatura = '';
      return;
    }

    // A lista só é remontada quando muda quem está nela, em que ordem ou em que
    // estado. O texto que envelhece minuto a minuto é trocado no lugar — remontar
    // faria a rolagem recomeçar do topo o tempo todo.
    var nova = itens.map(function(i){ return i.code + ':' + i._estado; }).join('|');
    if (nova !== assinatura) {
      assinatura = nova;
      var bloco = '<div class="bloco">' + itens.map(linha).join('') + '</div>';
      trilho.innerHTML = bloco + bloco;      // cópia para o laço infinito
      rolar(trilho, palco);
    } else {
      var porCodigo = {};
      itens.forEach(function(i){ porCodigo[i.code] = i._texto; });
      Array.prototype.forEach.call(trilho.querySelectorAll('.estado'), function(el){
        var t = porCodigo[el.getAttribute('data-c')];
        if (t && el.textContent !== t) el.textContent = t;
      });
    }

    document.getElementById('rodape').textContent =
      itens.length + (itens.length === 1 ? ' etiqueta monitorada' : ' etiquetas monitoradas') +
      (vencidos ? '  ·  ' + vencidos + ' para descartar' : '');
  }

  function buscar(){
    if (!TOKEN) {
      document.getElementById('trilho').innerHTML =
        '<div class="vazio"><b>Link incompleto</b><span>Falta o código da unidade no endereço.</span></div>';
      return;
    }
    fetch(API + '?u=' + encodeURIComponent(TOKEN) + '&h=1',
          { headers: { 'apikey':ANON, 'Authorization':'Bearer ' + ANON } })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j.error) throw new Error(j.error);
        dados = j; desenhar();
        document.getElementById('status').textContent =
          'atualizado às ' + new Date().toLocaleTimeString('pt-BR',
            { timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit' });
      })
      .catch(function(e){
        document.getElementById('status').textContent = 'sem conexão — ' + e.message;
      });
  }

  relogio();  buscar();
  setInterval(relogio, 15000);
  setInterval(buscar, 90000);
  // Os textos envelhecem sozinhos entre uma busca e outra.
  setInterval(function(){ desenhar(); }, 60000);
  window.addEventListener('resize', function(){
    assinatura = ''; desenhar();
  });
})();
</script>
</body>
</html>
